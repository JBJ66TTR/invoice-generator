<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EasyInvoice - Invoice Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 25px;
      color: #2563eb;
    }

    h2 {
      margin: 25px 0 12px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f1f5f9;
    }

    .item-input {
      width: 100%;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    .add-btn {
      background: #e2e8f0;
      color: #222;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      margin: 0;
    }

    .print-btn {
      background: #2563eb;
      color: white;
      margin-left: 8px;
    }

    .total {
      margin-top: 25px;
      margin-left: auto;
      max-width: 300px;
      font-size: 18px;
    }

    .total div {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .grand-total {
      font-size: 23px;
      font-weight: bold;
      border-top: 2px solid #222;
      margin-top: 8px;
      padding-top: 12px !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 12px;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        max-width: none;
      }

      button {
        display: none;
      }

      input {
        border: none;
        padding: 5px 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>EasyInvoice</h1>

  <h2>Your Business</h2>

  <div class="grid">
    <input id="businessName" placeholder="Business name">
    <input id="businessEmail" placeholder="Business email">
    <input id="businessPhone" placeholder="Phone number">
    <input id="invoiceNumber" placeholder="Invoice number">
  </div>

  <h2>Customer</h2>

  <div class="grid">
    <input id="customerName" placeholder="Customer name">
    <input id="customerEmail" placeholder="Customer email">
  </div>

  <h2>Items</h2>

  <table>
    <thead>
      <tr>
        <th>Description</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Total</th>
        <th></th>
      </tr>
    </thead>

    <tbody id="items"></tbody>
  </table>

  <button class="add-btn" onclick="addItem()">+ Add Item</button>

  <div class="total">
    <div>
      <span>Subtotal</span>
      <span id="subtotal">0.00</span>
    </div>

    <div>
      <span>Tax (%)</span>
      <input
        id="tax"
        type="number"
        value="0"
        min="0"
        oninput="calculateTotal()"
        style="width:80px;"
      >
    </div>

    <div>
      <span>Tax amount</span>
      <span id="taxAmount">0.00</span>
    </div>

    <div class="grand-total">
      <span>Total</span>
      <span id="grandTotal">0.00</span>
    </div>
  </div>

  <button class="print-btn" onclick="window.print()">
    Print / Save PDF
  </button>

</div>

<script>

  function addItem() {

    const table = document.getElementById("items");

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>
        <input
          class="item-input description"
          placeholder="Service or product"
        >
      </td>

      <td>
        <input
          class="item-input quantity"
          type="number"
          value="1"
          min="1"
          oninput="calculateTotal()"
        >
      </td>

      <td>
        <input
          class="item-input price"
          type="number"
          value="0"
          min="0"
          oninput="calculateTotal()"
        >
      </td>

      <td class="item-total">
        0.00
      </td>

      <td>
        <button
          class="delete-btn"
          onclick="deleteItem(this)"
        >
          X
        </button>
      </td>
    `;

    table.appendChild(row);

    calculateTotal();
  }


  function deleteItem(button) {

    button.closest("tr").remove();

    calculateTotal();
  }


  function calculateTotal() {

    const rows = document.querySelectorAll("#items tr");

    let subtotal = 0;

    rows.forEach(row => {

      const quantity =
        parseFloat(row.querySelector(".quantity").value) || 0;

      const price =
        parseFloat(row.querySelector(".price").value) || 0;

      const total = quantity * price;

      row.querySelector(".item-total").textContent =
        total.toFixed(2);

      subtotal += total;
    });

    const taxRate =
      parseFloat(document.getElementById("tax").value) || 0;

    const taxAmount =
      subtotal * taxRate / 100;

    const grandTotal =
      subtotal + taxAmount;

    document.getElementById("subtotal").textContent =
      subtotal.toFixed(2);

    document.getElementById("taxAmount").textContent =
      taxAmount.toFixed(2);

    document.getElementById("grandTotal").textContent =
      grandTotal.toFixed(2);
  }


  // Start with one item
  addItem();

</script>

</body>
</html>
